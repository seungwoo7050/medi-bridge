# PR과 main 푸시마다: 타입·린트·단위 테스트 → 확장·정적 웹 빌드 및 권한 검사 → Playwright E2E 검증.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: 정적 검사·빌드·E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 타입·린트·단위 테스트 (5개 워크스페이스)
        run: pnpm verify

      - name: 확장프로그램·정적 웹 빌드 및 패키징
        run: |
          pnpm build
          pnpm --filter @medi-bridge/web run build:cf
          pnpm zip:ext

      - name: 확장 매니페스트 최소 권한 및 정적 번들 검증
        run: |
          if grep -Eq 'localhost|workers\.dev' apps/extension/output/chrome-mv3/manifest.json; then
            echo "manifest.json에 허용되지 않은 호스트 권한이 포함되어 있습니다."
            exit 1
          fi
          test -f apps/web/.cf-dist/index.html
          test -f apps/web/.cf-dist/privacy/index.html

      - name: Playwright Chromium 설치
        run: pnpm --filter @medi-bridge/extension exec playwright install --with-deps chromium

      - name: Extension MV3 & 정적 웹 Playwright E2E
        run: pnpm test:e2e

      - name: E2E 실패 시 결과 아티팩트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/extension/test-results/
            apps/web/test-results/
          retention-days: 7
